name: Bug Report
description: A crash, leak, incorrect result or undefined behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: File and function
      placeholder: src/kernel.c, cdin_doc_replace
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: Conformance vector or code snippet
    validations:
      required: true
