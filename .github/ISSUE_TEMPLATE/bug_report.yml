name: Bug
description: Incorrect kernel behavior, crash, or memory issue
title: "[BUG] "
body:
  - type: input
    id: area
    attributes:
      label: Kernel area
      placeholder: document / text / search / transaction / notification
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and expected behavior
    validations:
      required: true
