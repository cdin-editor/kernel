name: Kernel benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "bench/**"
      - "Makefile"
      - "pipeline.toml"

permissions:
  contents: read

jobs:
  scalability:
    name: 125 MiB document benchmark
    uses: m-mdy-m/pipeline/.github/workflows/benchmark.yml@main
    with:
      pipeline-ref: main
      benchmark-command: make bench-scale SIZE_MIB=125
      category: scalability
      repetitions: 3
      setup-command: bash scripts/install-deps.sh --prefix .deps
