name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-install:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-gcc
            os: ubuntu-latest
            cc: gcc
          - id: linux-clang
            os: ubuntu-latest
            cc: clang
          - id: macos-clang
            os: macos-latest
            cc: clang
          - id: windows-ucrt64
            os: windows-latest
            cc: gcc

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux toolchains
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config

      - name: Install Windows UCRT64 toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            make
            zip

      - name: Build all core library forms (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          make CC=${{ matrix.cc }} clean
          make CC=${{ matrix.cc }} all shared ffi-shared quickstart

      - name: Build all core library forms (Windows UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make OS= SHELL=/usr/bin/bash CC=gcc clean
          make OS= SHELL=/usr/bin/bash CC=gcc all shared ffi-shared quickstart

      - name: Run conformance, regression, and concurrency tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: make CC=${{ matrix.cc }} check

      - name: Run conformance, regression, and concurrency tests (Windows UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make OS= SHELL=/usr/bin/bash CC=gcc check

      - name: Check public header from C11 and C++17 (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
        run: bash scripts/check-public-header.sh

      - name: Check public header from C11 and C++17 (Windows UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: gcc
          CXX: g++
        run: bash scripts/check-public-header.sh

      - name: Stage installation and test installed static/shared consumers (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
        run: |
          stage="$PWD/build/stage"
          make CC=${{ matrix.cc }} DESTDIR="$stage" PREFIX=/cdin install
          bash scripts/verify-installed.sh "$stage/cdin"
          make CC=${{ matrix.cc }} DESTDIR="$stage" PREFIX=/cdin uninstall
          test ! -e "$stage/cdin/include/cdin/kernel.h"
          test ! -e "$stage/cdin/lib/libcdin_kernel.a"

      - name: Stage installation and test installed static/shared consumers (Windows UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: gcc
        run: |
          stage="$PWD/build/stage"
          make OS= SHELL=/usr/bin/bash CC=gcc DESTDIR="$stage" PREFIX=/cdin install
          bash scripts/verify-installed.sh "$stage/cdin"
          make OS= SHELL=/usr/bin/bash CC=gcc DESTDIR="$stage" PREFIX=/cdin uninstall
          test ! -e "$stage/cdin/include/cdin/kernel.h"
          test ! -e "$stage/cdin/lib/libcdin_kernel.a"

  asan-ubsan:
    name: ASan + UBSan (all conformance and C tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: make CC=gcc asan

  tsan:
    name: TSan (all conformance and C tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: make CC=gcc tsan
