name: Publish multi-platform GHCR packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish cdin-kernel packages to GHCR
    permissions:
      contents: read
      packages: write
    uses: m-mdy-m/pipeline/.github/workflows/oci-publish.yml@feat/oci-target-media-types
    with:
      pipeline-ref: feat/oci-target-media-types
      package-name: cdin-kernel
      component-id: cdin-kernel
      variant: default
      test-command: bash scripts/ci-check.sh
      build-command: |
        set -euo pipefail
        PIPELINE_RELEASE_TAG="$GITHUB_REF_NAME" bash scripts/ci-package.sh
      artifact-path: dist/cdin-kernel-*.tar.gz
      artifact-media-type: application/vnd.pipeline.package.layer.v1.tar+gzip
      build-matrix-json: >-
        {"include":[
          {
            "id":"linux-x86_64",
            "os":"ubuntu-24.04",
            "target_os":"linux",
            "architecture":"x86_64",
            "abi":"gnu",
            "artifact_path":"dist/cdin-kernel-*.tar.gz",
            "artifact_media_type":"application/vnd.pipeline.package.layer.v1.tar+gzip"
          },
          {
            "id":"linux-arm64",
            "os":"ubuntu-24.04-arm",
            "target_os":"linux",
            "architecture":"arm64",
            "abi":"gnu",
            "artifact_path":"dist/cdin-kernel-*.tar.gz",
            "artifact_media_type":"application/vnd.pipeline.package.layer.v1.tar+gzip"
          },
          {
            "id":"macos-x86_64",
            "os":"macos-15-intel",
            "target_os":"macos",
            "architecture":"x86_64",
            "abi":"darwin",
            "artifact_path":"dist/cdin-kernel-*.tar.gz",
            "artifact_media_type":"application/vnd.pipeline.package.layer.v1.tar+gzip"
          },
          {
            "id":"macos-arm64",
            "os":"macos-15",
            "target_os":"macos",
            "architecture":"arm64",
            "abi":"darwin",
            "artifact_path":"dist/cdin-kernel-*.tar.gz",
            "artifact_media_type":"application/vnd.pipeline.package.layer.v1.tar+gzip"
          },
          {
            "id":"windows-x86_64",
            "os":"windows-latest",
            "target_os":"windows",
            "architecture":"x86_64",
            "abi":"ucrt64",
            "msys2_msystem":"UCRT64",
            "msys2_packages":"git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-pkgconf make zip unzip",
            "artifact_path":"dist/cdin-kernel-*.zip",
            "artifact_media_type":"application/zip"
          }
        ]}
