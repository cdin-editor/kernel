name: OCI package smoke publication

on:
  push:
    branches: ["feat/oci-artifacts-ghcr"]

permissions:
  contents: read
  packages: write

jobs:
  publish-smoke:
    name: Build, test and publish the kernel package
    permissions:
      contents: read
      packages: write
    uses: m-mdy-m/pipeline/.github/workflows/oci-publish.yml@feat/oci-artifacts-ghcr
    with:
      pipeline-ref: feat/oci-artifacts-ghcr
      package-name: cdin-kernel-smoke
      component-id: cdin-kernel
      variant: integration
      version: 0.0.0-smoke.${{ github.run_number }}.${{ github.run_attempt }}
      build-command: |
        set -euo pipefail
        PIPELINE_RELEASE_TAG="v0.0.0-smoke.${{ github.run_number }}.${{ github.run_attempt }}" \
          bash scripts/ci-package.sh
      artifact-path: dist/cdin-kernel-*.tar.gz
      artifact-test-command: |
        set -euo pipefail
        listing="$(tar -tzf "$PIPELINE_ARTIFACT_PATH")"
        package_root="${listing%%/*}"
        [[ -n "$package_root" && "$package_root" != "$listing" ]] || {
          echo "release archive has no single package root" >&2
          exit 1
        }
        for required in \
          BUILD-INFO.txt \
          INSTALL.md \
          LICENSE \
          README.md \
          install.sh \
          install.ps1 \
          include/cdin/kernel.h \
          include/m-mdy-m/log.h \
          lib/libcdin_kernel.a \
          lib/libm-mdy-m-log.a \
          lib/pkgconfig/cdin-kernel.pc \
          lib/pkgconfig/m-mdy-m-log.pc; do
          grep -Fxq "$package_root/$required" <<<"$listing" || {
            echo "release archive is missing $required" >&2
            exit 1
          }
        done
        tar -xOzf "$PIPELINE_ARTIFACT_PATH" "$package_root/BUILD-INFO.txt" \
          | grep -Fxq "Package version: $PIPELINE_PACKAGE_VERSION"
        tar -xOzf "$PIPELINE_ARTIFACT_PATH" "$package_root/BUILD-INFO.txt" \
          | grep -Fxq "Platform: linux"
        tar -xOzf "$PIPELINE_ARTIFACT_PATH" "$package_root/BUILD-INFO.txt" \
          | grep -Fxq "Architecture: x86_64"
      build-matrix-json: >-
        {"include":[{"id":"linux-x86_64","os":"ubuntu-24.04","target_os":"linux","architecture":"x86_64","abi":"gnu","artifact_path":"dist/cdin-kernel-*.tar.gz"}]}
      dry-run: false
      allow-branch-publish: true
