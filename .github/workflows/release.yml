name: Build and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish platform packages
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: m-mdy-m/pipeline/.github/workflows/release.yml@main
    with:
      pipeline-ref: main
      changelog-path: CHANGELOG.md
      asset-profile: standard
      test-command: bash scripts/ci-check.sh
      build-command: bash scripts/ci-package.sh
      artifact-path: |
        dist/cdin-kernel-*.zip
        dist/cdin-kernel-*.zip.sha256
        dist/cdin-kernel-*.tar.gz
        dist/cdin-kernel-*.tar.gz.sha256
        dist/cdin-kernel-*-cmake-prefix.zip
        dist/cdin-kernel-*-cmake-prefix.zip.sha256
        dist/cdin-kernel-*-cmake-prefix.tar.gz
        dist/cdin-kernel-*-cmake-prefix.tar.gz.sha256
      asset-preparation-command: >-
        python scripts/generate_registry_metadata.py
        --tag "$PIPELINE_RELEASE_TAG"
        --source-revision "$PIPELINE_SOURCE_SHA"
        --artifact-dir "$RELEASE_ASSETS_DIRECTORY"
        --output "$RELEASE_ASSETS_DIRECTORY/release-build-metadata/kernel-$PIPELINE_RELEASE_VERSION.json"
      build-matrix-json: >-
        {"include":[
          {"id":"linux-x86_64","os":"ubuntu-24.04"},
          {"id":"linux-arm64","os":"ubuntu-24.04-arm"},
          {"id":"macos-arm64","os":"macos-15"},
          {"id":"macos-x86_64","os":"macos-15-intel"},
          {"id":"windows-x86_64-ucrt64","os":"windows-latest","msys2_msystem":"UCRT64","msys2_packages":"git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-python make zip unzip"}
        ]}
